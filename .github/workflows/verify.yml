name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  proof-harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Verify committed dist is current
        run: git diff --exit-code -- dist

      - name: Verify LLM authority boundary
        run: npm run verify:llm-boundary

      - name: Verify demo regression suite
        run: npm run verify:demo

      - name: Verify golden benchmark suite
        run: npm run verify:golden

      - name: Verify proof commands leave the worktree clean
        shell: bash
        run: |
          status="$(git status --short)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Verify packed package smoke
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          npm pack --json --pack-destination "$tmpdir" > "$tmpdir/pack.json"
          tarball="$(node -e "const path=require('path'); const fs=require('fs'); const pack=JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0]; console.log(path.join(process.argv[1], pack.filename));" "$tmpdir" "$tmpdir/pack.json")"
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/target"
          cd "$smoke"
          npm init -y
          npm install --no-package-lock "$tarball"
          npx cognianalysis --help
          npx cognianalysis init-harness ./target --harness generic
          test -f ./target/AGENTS.md

      - name: Record non-blocking market-proof boundary
        shell: bash
        run: |
          set +e
          npm run verify:baseline > baseline.out 2>&1
          baseline_status=$?
          node dist/cli.js doctor examples/demo-repo --market-proof --strict > market-proof.out 2>&1
          strict_status=$?
          {
            echo "## Market Proof Boundary"
            echo
            echo "Baseline verifier exit code: ${baseline_status}"
            echo
            echo '```text'
            cat baseline.out
            echo '```'
            echo
            echo "Strict market-proof exit code: ${strict_status}"
            echo
            echo '```text'
            cat market-proof.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
