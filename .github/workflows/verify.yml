name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  proof-harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Verify workflow leaves tracked files clean
        shell: bash
        run: |
          status="$(git status --short --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
