name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  proof-harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      - name: Product CLI smoke
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          repo="$tmpdir/demo-repo"
          cp -R examples/demo-repo "$repo"

          node dist/cli.js --help
          node dist/cli.js analyze "$repo" --mode blueprint --goal "CI product smoke"
          node dist/cli.js status "$repo"
          node dist/cli.js eval "$repo" --strict
          node dist/cli.js open "$repo"

          test -f "$repo/.analysis/inventory.json"
          test -f "$repo/.analysis/workpack-manifest.json"
          test -d "$repo/.analysis/workpacks"
          test -f "$repo/.analysis/report/index.html"
          test ! -d "$repo/.analysis/source_tier_tasks"
          test ! -d "$repo/.analysis/llm_tasks"

      - name: Complete-audit isolation smoke
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          repo="$tmpdir/demo-repo"
          cp -R examples/demo-repo "$repo"
          rm -rf "$repo/.analysis"

          node dist/cli.js analyze "$repo" --mode complete-audit --scope complete

          test -f "$repo/.analysis/inventory.json"
          test -d "$repo/.analysis/source_tier_tasks"
          test -d "$repo/.analysis/llm_tasks"

      - name: Verify packed package smoke
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          npm pack --json --pack-destination "$tmpdir" > "$tmpdir/pack.json"
          tarball="$(node -e "const path=require('path'); const fs=require('fs'); const pack=JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0]; console.log(path.join(process.argv[1], pack.filename));" "$tmpdir" "$tmpdir/pack.json")"
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/target"
          printf '# Package smoke\n' > "$smoke/target/README.md"
          cd "$smoke"
          npm init -y
          npm install --no-package-lock "$tarball"
          npx cognianalysis --help
          npx cognianalysis analyze ./target --mode brief --goal "Package smoke"
          npx cognianalysis status ./target || test "$?" -eq 1
          test -f ./target/.analysis/inventory.json
          test -f ./target/.analysis/workpack-manifest.json
          test -d ./target/.analysis/workpacks

      - name: Verify workflow leaves tracked files clean
        shell: bash
        run: |
          status="$(git status --short --untracked-files=no)"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi
